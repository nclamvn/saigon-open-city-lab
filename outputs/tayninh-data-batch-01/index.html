<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gia Lộc Data Workbench</title>
<link rel="stylesheet" href="static/workbench.css">
<main>
  <section class="toolbar">
    <div>
      <p class="eyebrow">RtR Batch 01</p>
      <h1>Gia Lộc Data Workbench</h1>
      <p class="subtitle">Kiểm kê nguồn dữ liệu có thể dùng cho digital twin trước khi có dữ liệu payload Hera.</p>
    </div>
    <div class="controls" aria-label="Bộ lọc dữ liệu">
      <label>
        Trạng thái
        <select id="statusFilter">
          <option value="all">Tất cả</option>
          <option value="acquired">Đã thu</option>
          <option value="candidate">Ứng viên</option>
          <option value="blocked">Bị chặn</option>
          <option value="missing">Đầu vào thiếu</option>
        </select>
      </label>
      <label>
        Tìm kiếm
        <input id="searchBox" type="search" placeholder="Tên nguồn, nhà xuất bản, giới hạn..." autocomplete="off">
      </label>
    </div>
  </section>
  <section class="summary" id="summary" aria-label="Tổng quan trạng thái"></section>
  <section class="aoi" id="aoiPanel"></section>
  <section class="notice" id="notice" aria-live="polite"></section>
  <section class="records" id="records" aria-label="Danh sách nguồn dữ liệu"></section>
  <section class="coverage">
    <h2>Liên hệ yêu cầu</h2>
    <div id="coverage"></div>
  </section>
</main>
<script src="static/workbench.js" type="module"></script>
